apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: product-master-data-agent
  description: A Sales Product Master Data Assistant that enables Sales Representatives to ask natural language questions about SAP S/4HANA product master data and receive instant, accurate answers

provides:
  apis:
    - name: product-master-data-agent
      kind: a2a
      ordId: customer.build:apiResource:sales-product-master-data-a7b6e.product-master-data-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-ce-product-0003-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sales-product-master-data-a7b6e.sap-s4-ce-product-0003-mcp-server:v1
  - name: sap-s4-api-product-srv-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sales-product-master-data-a7b6e.sap-s4-api-product-srv-mcp-server:v1
  - name: sap-s4-api-clfn-product-srv-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sales-product-master-data-a7b6e.sap-s4-api-clfn-product-srv-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
